<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中药饮片烘干排程台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>中药饮片烘干排程台</h1>
    <button id="resetBtn" class="btn">恢复预置数据</button>
  </header>

  <main>
    <section class="panel">
      <h2>机器看板</h2>
      <div id="machineBoard" class="machine-board"></div>
    </section>

    <section class="panel">
      <h2>排批登记</h2>
      <form id="scheduleForm">
        <div class="form-grid">
          <label>批次
            <select id="fBatch" required></select>
          </label>
          <label>药材
            <input id="fHerb" type="text" readonly>
          </label>
          <label>含水率（%）
            <input id="fMoisture" type="number" step="0.1" min="0" max="100" required>
          </label>
          <label>目标干度（%）
            <input id="fTarget" type="number" step="0.1" min="0" max="100" required>
          </label>
          <label>入炉时刻
            <input id="fIn" type="datetime-local" required>
          </label>
          <label>出锅时刻
            <input id="fOut" type="datetime-local" required>
          </label>
          <label>烘干机
            <select id="fMachine" required></select>
          </label>
        </div>
        <div id="fHints" class="hints"></div>
        <button type="submit" class="btn btn-primary">排批</button>
      </form>
      <div id="message"></div>
    </section>

    <section class="panel">
      <h2>批次档案</h2>
      <div id="batchArchive" class="table-wrap"></div>
    </section>

    <section class="panel">
      <h2>旧排程（保留备查）</h2>
      <div id="historyList"></div>
    </section>
  </main>

  <script src="js/rules.js"></script>
  <script src="js/machines.js"></script>
  <script src="js/batches.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
